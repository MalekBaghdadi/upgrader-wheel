# Publishes a GitHub release when a version tag is pushed (git tag v1.2.0 && git push origin v1.2.0):
# builds the mod and attaches the jar and the Windows installer, with that version's CHANGELOG section as notes.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        run: sh ./gradlew build --no-daemon
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar=$(ls build/libs/upgraderwheel-*.jar | grep -v -e -dev -e -sources | head -1)
          case "$jar" in *"-$version.jar") ;; *) echo "Built $jar, but the tag says $version (check mod_version)"; exit 1;; esac
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" "$jar" install/install.ps1 install/Install-UpgraderWheel.bat \
            --title "Upgrader Wheel $version" --notes-file notes.md
